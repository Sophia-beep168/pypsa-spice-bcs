# coding: utf-8

# Base configuration includes paths and general settings which are not relevant to the scenario settings or model constraints.

version: 0.1.0

logging:
  level: INFO
  format: "%(levelname)s:%(name)s:%(message)s"

#####Init settings#####
path_configs:
  data_folder_name: pypsa-spice-data   # Nombre de la carpeta dentro de data/
  project_name: project_02             # Tu carpeta de proyecto
  input_scenario_name: scenario_01     # Subcarpeta con los CSVs de input
  output_scenario_name: scenario_01_referencia_BCS  # Se crea automáticamente en output/


base_configs:
  regions:
    MX: ["BCS"]   # País MX (ISO2), subregión BCS (coincide con prefijo MX_BCS_ en buses.csv)
  years: [2025, 2030, 2035]   # Solo los años con datos de José. Quitar 2040-2050.
  sector: ["p"]               # Solo sector eléctrico (power)
  currency: USD

